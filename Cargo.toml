[package]
name = "sui-mcp-server"
version = "0.1.0"
edition = "2024"
description = "MCP server for Sui blockchain -- wallets, balances, transfers, staking, network ops via JSON-RPC"
license = "MIT"
authors = ["Purple Squirrel Media LLC"]

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.9"
ed25519-dalek = { version = "2", features = ["rand_core"] }
bip39 = { version = "2", features = ["rand"] }
hex = "0.4"
